<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View detailed Juventus player information, statistics, nationality, position and career highlights.">

    <title>Juventus Fan Website - Player Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Juventus Fan Website</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="matches.html">Matches</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">

        <a href="players.html" class="btn btn-outline-dark mb-4">
            ← Back to Players
        </a>

        <section class="player-profile-card">
            <h1 class="mb-4">Player Profile</h1>

            <div id="player"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            &copy; 2026 Juventus Fan Website. Educational project.
        </p>
    </footer>

    <!-- Player Profile Script -->
    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id');

        const playerDiv = document.getElementById('player');

        if (!playerId) {

            playerDiv.innerHTML = `
                <p class="text-danger">
                    No player selected.
                </p>
            `;

        } else {

            fetch('data/profiles/' + playerId + '.json?v=' + new Date().getTime())

                .then(response => {

                    if (!response.ok) {
                        throw new Error('Player profile could not be loaded.');
                    }

                    return response.json();
                })

                .then(data => {

                    let detailsOutput = '';

                    Object.keys(data).forEach(key => {

                        if (key !== 'id' && key !== 'image') {

                            detailsOutput += `
                                <p>
                                    <strong>${key}:</strong> ${data[key]}
                                </p>
                            `;
                        }

                    });

                    playerDiv.innerHTML = `

                        <div class="card shadow-sm p-4">

                            <div class="row align-items-start">

                                <div class="col-md-7">

                                    ${detailsOutput}

                                </div>

                                <div class="col-md-5 text-center">

                                <img
                                    src="${data.image}"
                                    alt="${data.player}"
                                    class="profile-photo img-fluid"
                                >

                                </div>

                            </div>

                        </div>

                    `;

                })

                .catch(error => {

                    playerDiv.innerHTML = `
                        <p class="text-danger">
                            ${error.message}
                        </p>
                    `;

                });

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
